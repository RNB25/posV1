; File ini hanya panduan. PHP tidak otomatis membaca file bernama settingan.php.ini.
; Salin pengaturan yang diperlukan ke C:\php\php.ini, lalu restart terminal/server.
; Jika PHP dipasang di folder lain, sesuaikan extension_dir.
; Jangan menambahkan extension yang sama dua kali; aktifkan baris yang sudah ada.

extension_dir = "C:/php/ext"

extension=curl
extension=fileinfo
extension=gd
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=zip

; Batas foto produk: aplikasi menerima maksimal 50 MB per gambar.
upload_max_filesize = 50M
post_max_size = 64M

; Jika Windows memblokir php_fileinfo.dll, fileinfo tetap tidak akan aktif.
; Gunakan PHP yang disetujui Windows; jangan menonaktifkan kebijakan keamanan.
